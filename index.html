<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Analysis</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Performance Analysis</h1>
        <p class="subtitle">Enter student marks to analyze performance</p>

        <form action="StudentPerformance" method="post">

            <label>Student Name</label>
            <input type="text" name="name" placeholder="Enter student name" required>

            <label>Roll Number</label>
            <input type="text" name="roll" placeholder="Enter roll number" required>

            <label>Mathematics Marks</label>
            <input type="number" name="maths" min="0" max="100" required>

            <label>Science Marks</label>
            <input type="number" name="science" min="0" max="100" required>

            <label>English Marks</label>
            <input type="number" name="english" min="0" max="100" required>

            <label>Computer Science Marks</label>
            <input type="number" name="computer" min="0" max="100" required>

            <label>Social Science Marks</label>
            <input type="number" name="social" min="0" max="100" required>

            <button type="submit">Analyze Performance</button>

        </form>

    </div>

</body>
</html>
